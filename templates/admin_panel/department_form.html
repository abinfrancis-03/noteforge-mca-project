{% extends 'base.html' %}
{% block title %}{{ action }} Department — Noteforge{% endblock %}

{% block content %}
<div class="row justify-content-center py-3">
  <div class="col-md-8 col-lg-6">
    <div class="card card-style bg-white p-4 p-md-5 shadow-sm">
      <div class="d-flex align-items-center justify-content-between mb-4 pb-2 border-bottom">
        <h5 class="fw-bold text-dark mb-0 d-flex align-items-center gap-2">
          <i class="bi bi-building fs-5" style="color: var(--nf-indigo) !important;"></i> {{ action }} Department
        </h5>
        <a href="{% url 'department_list' %}" class="btn btn-sm btn-light border rounded-pill px-3">← Back</a>
      </div>

      <form method="post">
        {% csrf_token %}
        <input type="hidden" name="next" value="{{ request.GET.next|default:request.META.HTTP_REFERER }}">
        <div class="mb-3">
          <label class="form-label fw-semibold text-dark small">Department Name</label>
          <input type="text" name="name" class="form-control" value="{{ dept.name|default:'' }}" placeholder="e.g. Master of Computer Applications" required>
        </div>

        <div class="mb-4">
          <label class="form-label fw-semibold text-dark small">Short Code</label>
          <input type="text" name="code" class="form-control" value="{{ dept.code|default:'' }}" placeholder="e.g. MCA" required>
        </div>

        <div class="d-flex gap-2">
          <button type="submit" class="btn btn-primary btn-pill px-4 fw-semibold">{{ action }} Department</button>
          <a href="{% url 'department_list' %}" class="btn btn-light border btn-pill px-4 text-dark fw-semibold">Cancel</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
