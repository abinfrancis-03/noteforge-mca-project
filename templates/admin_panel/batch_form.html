{% extends 'base.html' %}
{% block title %}Add Batch — Noteforge{% endblock %}

{% block content %}
<div class="row justify-content-center py-3">
  <div class="col-md-9 col-lg-7">
    <div class="card card-style bg-white p-4 p-md-5 shadow-sm">
      <div class="d-flex align-items-center justify-content-between mb-4 pb-2 border-bottom">
        <h5 class="fw-bold text-dark mb-0 d-flex align-items-center gap-2">
          <i class="bi bi-mortarboard fs-5" style="color: var(--nf-indigo) !important;"></i> Add Student Batch
        </h5>
        <a href="{% url 'batch_list' %}" class="btn btn-sm btn-light border rounded-pill px-3">← Back</a>
      </div>

      <form method="post">
        {% csrf_token %}
        <input type="hidden" name="next" value="{{ request.GET.next|default:request.META.HTTP_REFERER }}">
        <div class="mb-3">
          <label class="form-label fw-semibold text-dark small">Batch Name <span class="text-muted fw-normal">(Optional)</span></label>
          <input type="text" name="name" class="form-control" placeholder="e.g. MCA 2023–2026">
        </div>

        <div class="row g-3 mb-3">
          <div class="col-6">
            <label class="form-label fw-semibold text-dark small">Start Month</label>
            <select name="start_month" class="form-select" required>
              <option value="">Month</option>
              <option value="1">January</option><option value="2">February</option><option value="3">March</option>
              <option value="4">April</option><option value="5">May</option><option value="6">June</option>
              <option value="7">July</option><option value="8">August</option><option value="9">September</option>
              <option value="10">October</option><option value="11">November</option><option value="12">December</option>
            </select>
          </div>
          <div class="col-6">
            <label class="form-label fw-semibold text-dark small">Start Year</label>
            <input type="number" name="start_year" class="form-control" min="2000" max="2099" placeholder="e.g. 2023" required>
          </div>
        </div>

        <div class="row g-3 mb-4">
          <div class="col-6">
            <label class="form-label fw-semibold text-dark small">End Month</label>
            <select name="end_month" class="form-select" required>
              <option value="">Month</option>
              <option value="1">January</option><option value="2">February</option><option value="3">March</option>
              <option value="4">April</option><option value="5">May</option><option value="6">June</option>
              <option value="7">July</option><option value="8">August</option><option value="9">September</option>
              <option value="10">October</option><option value="11">November</option><option value="12">December</option>
            </select>
          </div>
          <div class="col-6">
            <label class="form-label fw-semibold text-dark small">End Year</label>
            <input type="number" name="end_year" class="form-control" min="2000" max="2099" placeholder="e.g. 2026" required>
          </div>
        </div>

        <div class="d-flex gap-2">
          <button type="submit" class="btn btn-primary btn-pill px-4 fw-semibold">Create Batch</button>
          <a href="{% url 'batch_list' %}" class="btn btn-light border btn-pill px-4 text-dark fw-semibold">Cancel</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
