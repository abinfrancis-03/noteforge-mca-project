{% extends 'base.html' %}
{% block title %}Change Password — Noteforge{% endblock %}
{% block topbar_title %}Account Security{% endblock %}

{% block content %}
<div class="page-header">
  <div>
    <h1>Change Account Password</h1>
    <p>Update your password to keep your student account secure</p>
  </div>
</div>

<div class="card" style="max-width: 520px;">
  <div class="card-body">
    <form method="post">
      {% csrf_token %}
      
      <div class="form-group" style="margin-bottom: 16px;">
        <label>Current / Temporary Password *</label>
        <input type="password" name="old_password" required placeholder="Enter current password">
      </div>

      <div class="form-group" style="margin-bottom: 16px;">
        <label>New Password *</label>
        <input type="password" name="new_password1" required minlength="6" placeholder="Enter new password (min 6 chars)">
      </div>

      <div class="form-group" style="margin-bottom: 24px;">
        <label>Confirm New Password *</label>
        <input type="password" name="new_password2" required minlength="6" placeholder="Re-enter new password">
      </div>

      <div class="form-actions">
        <button type="submit" class="btn btn-primary">Update Password</button>
        <a href="{% url 'student_dashboard' %}" class="btn btn-outline">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
